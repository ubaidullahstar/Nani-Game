<style>
:root{
  --bg:#0d1726;--tile:#16233a;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);
  --tx:#e9eff9;--mut:#8e9bb3;--ac:#5ef0ff;--bad:#ff5d73;--gold:#ffc247;
  --cU:#4aa8ff;--cR:#35e0a1;--cD:#a98bff;--cL:#ffc247;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;color:var(--tx);
  background:var(--bg);
  font-family:"Avenir Next","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation
}
/* BACKGROUND IMAGE: replace assets/img/bg.jpg with your own picture (keep the same name).
   Make the overlay lighter/darker by changing the three rgba(...) numbers. */
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(rgba(6,10,20,.50),rgba(6,10,20,.16) 40%,rgba(6,10,20,.58)),url("assets/img/bg.jpg") center/cover no-repeat}
#app{height:100%;display:flex;align-items:center;justify-content:center;padding:12px 14px}
.screen{display:none;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:520px;max-height:100%}
.screen.on{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 20px;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:active{transform:scale(.96)}
.btn.main{background:var(--ac);color:#06222a;border-color:var(--ac);font-weight:700;padding:15px 40px;font-size:18px;box-shadow:0 0 28px rgba(94,240,255,.35)}
.btn.main:hover{background:#8af4ff}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.on{border-color:var(--ac);color:var(--ac)}

/* menu */
.logo{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold);filter:drop-shadow(0 0 18px rgba(94,240,255,.45))}
h1{margin:0;font-size:clamp(32px,10vw,48px);letter-spacing:-.02em;font-weight:800;text-align:center;line-height:1.05}
.sub{margin:0;color:#b9c4d8;text-align:center;line-height:1.5}
h1,.sub,.note,.credit,.ttl{text-shadow:0 2px 14px rgba(0,0,0,.85)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.credit{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--mut);opacity:.8;pointer-events:none}

/* level select */
#levels h2{margin:0;font-size:22px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;padding:14px}
.chip{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:18px}
.chip small{font-size:10px;color:var(--gold);letter-spacing:1px;min-height:12px}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.cur{border-color:var(--ac);box-shadow:0 0 14px rgba(94,240,255,.35)}

/* game */
.top{display:flex;align-items:center;gap:10px;width:100%}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;flex:none;background:var(--tile)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--ac);font-size:13px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 12px}
.stat small{display:block;color:var(--mut);font-size:11px;letter-spacing:.04em}
.stat b{font-size:17px;color:var(--ac)}
.ico{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:19px}
.board{width:min(94vw,60vh,520px);padding:8px;overflow:hidden}
#grid{position:relative;width:100%;aspect-ratio:1;display:grid;transition:opacity .3s}
.cell{margin:2px;border-radius:22%;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.05)}
.arrow{position:absolute;padding:0;margin:0;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .55s cubic-bezier(.5,0,.9,.45),opacity .55s ease-in;animation:pop .35s ease backwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.arrow .pad{width:84%;height:84%;border-radius:26%;background:rgba(255,255,255,.04);border:1.5px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 14%,transparent);transition:background .15s,border-color .15s,color .15s}
.arrow:hover .pad{background:color-mix(in srgb,var(--c) 18%,transparent)}
.arrow svg{width:64%;height:64%;filter:drop-shadow(0 0 4px currentColor)}
.arrow.out{opacity:0;pointer-events:none}
.arrow.bump{animation:bump .34s ease}
.arrow.bump .pad{border-color:var(--bad);color:var(--bad)}
@keyframes bump{0%,100%{transform:translate(0,0)}40%{transform:translate(calc(var(--dx)*16%),calc(var(--dy)*16%))}70%{transform:translate(calc(var(--dx)*-4%),calc(var(--dy)*-4%))}}
.arrow.hint .pad{animation:hint .8s ease-in-out 3;border-color:#fff;color:#fff}
@keyframes hint{50%{box-shadow:0 0 26px 4px #fff}}
.ring{position:absolute;inset:0;border-radius:26%;border:2px solid var(--c);animation:ring .5s ease-out forwards;pointer-events:none}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.6)}}
.note{color:var(--mut);font-size:13px;text-align:center;min-height:18px}

/* modal */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,9,14,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:20px;z-index:5}
#modal.on{display:flex;animation:fade .3s ease}
.card{padding:26px 28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:340px;width:100%;background:rgba(22,35,58,.9)}
.card h2{margin:0;font-size:25px}
.stars{font-size:38px;letter-spacing:6px;color:#3a4a66}
.stars i{font-style:normal;display:inline-block}
.stars i.f{color:var(--gold);text-shadow:0 0 18px rgba(255,194,71,.7);animation:star .5s cubic-bezier(.2,1.6,.4,1) backwards}
.stars i.f:nth-child(2){animation-delay:.18s}.stars i.f:nth-child(3){animation-delay:.36s}
@keyframes star{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.card .btn{width:100%}

@media (max-height:640px){.logo{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

var P=get('ntw_progress',{cur:0,unlocked:0,stars:{}});
var S=get('ntw_settings',{sfx:true,music:false});
if(/[?&]unlock/.test(location.search))P.unlocked=N-1;

/* ---------- audio ---------- */
var ac=null,A={};
function synth(kind){
  if(!S.sfx)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    var seq={start:[[392,.12],[523,.12],[659,.22]],correct:[[740,.09],[1100,.12]],wrong:[[160,.22,'square']],win:[[523,.15],[659,.15],[784,.15],[1047,.3]]}[kind]||[[440,.1]];
    var t=ac.currentTime;
    seq.forEach(function(n){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type=n[2]||'sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+n[1]);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n[1]);t+=n[1]*.9;
    });
  }catch(e){}
}
Object.keys(CONFIG.sounds).forEach(function(k){
  var a=new Audio(CONFIG.sounds[k]);a.preload='auto';
  A[k]={a:a,bad:false};
  a.addEventListener('error',function(){A[k].bad=true});
});
function stopSfx(){CONFIG.single.forEach(function(k){try{A[k].a.pause();A[k].a.currentTime=0}catch(e){}})}
function sfx(k){
  if(!S.sfx)return;
  var o=A[k],v=CONFIG.volume[k]!=null?CONFIG.volume[k]:0.8;
  if(o&&!o.bad){
    try{
      var a=o.a;
      if(CONFIG.single.indexOf(k)>-1){a.pause();a.currentTime=0}else a=a.cloneNode();
      a.volume=v;
      var p=a.play();if(p&&p.catch)p.catch(function(){synth(k)});
      return;
    }catch(e){}
  }
  synth(k);
}
var bgm=new Audio(CONFIG.music);bgm.loop=true;bgm.preload='auto';bgm.volume=CONFIG.musicVolume;
function music(){
  if(!S.music){bgm.pause();return}
  if(bgm.paused&&!document.hidden){var p=bgm.play();if(p&&p.catch)p.catch(function(){})}
}
document.addEventListener('visibilitychange',function(){if(document.hidden)bgm.pause();else music()});
document.addEventListener('click',music);  /* browsers only allow audio after a tap/click */
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

/* ---------- screens ---------- */
function show(id){['menu','levels','game'].forEach(function(s){$(s).classList.toggle('on',s===id)})}
function refreshMenu(){
  $('play').textContent=(P.cur>0||P.unlocked>0)?'Continue \u2022 Level '+(P.cur+1):'Play';
  $('sfx').textContent='Sound: '+(S.sfx?'On':'Off');$('sfx').classList.toggle('on',S.sfx);
  $('mus').textContent='Music: '+(S.music?'On':'Off');$('mus').classList.toggle('on',S.music);
}
function buildChips(){
  var c=$('chips');c.innerHTML='';
  for(var i=0;i<N;i++){(function(i){
    var b=document.createElement('button');b.className='chip'+(i===P.cur?' cur':'');
    var st=P.stars[i]||0;
    b.innerHTML=(i>P.unlocked?'&#128274;':(i+1))+'<small>'+(st?new Array(st+1).join('\u2605'):'')+'</small>';
    b.disabled=i>P.unlocked;
    b.addEventListener('click',function(){show('game');loadLevel(i)});
    c.appendChild(b);
  })(i)}
}

/* ---------- game ---------- */
var G={id:0,lv:0,moves:0,wrong:0,hints:0,arrows:[],left:0,total:0};
function arrowSvg(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'}

function loadLevel(i){
  var L=LEVELS[i],n=L.n,g=$('grid');
  stopSfx();G.id++;G.lv=i;G.moves=0;G.wrong=0;G.hints=0;G.arrows=[];
  g.style.opacity=1;g.innerHTML='';
  g.style.gridTemplateColumns='repeat('+n+',1fr)';g.style.gridTemplateRows='repeat('+n+',1fr)';
  for(var k=0;k<n*n;k++){var c=document.createElement('div');c.className='cell';g.appendChild(c)}
  var s=100/n;
  L.a.forEach(function(d,idx){
    var a={r:d[0],c:d[1],d:d[2],gone:false};
    var b=document.createElement('button');
    b.className='arrow';b.setAttribute('aria-label','Arrow pointing '+({U:'up',D:'down',L:'left',R:'right'})[a.d]);
    b.style.cssText='width:'+s+'%;height:'+s+'%;left:'+(a.c*s)+'%;top:'+(a.r*s)+'%;--c:'+COL[a.d]+';--dx:'+DIR[a.d][1]+';--dy:'+DIR[a.d][0]+';animation-delay:'+Math.min(idx*18,500)+'ms';
    b.innerHTML='<span class="pad">'+arrowSvg()+'</span>';
    b.querySelector('svg').style.transform='rotate('+ROT[a.d]+'deg)';
    b.addEventListener('click',function(){tap(a)});
    b.addEventListener('animationend',function(e){
      if(e.animationName==='bump')b.classList.remove('bump');
      if(e.animationName==='hint')b.classList.remove('hint');
    });
    a.el=b;g.appendChild(b);G.arrows.push(a);
  });
  G.left=G.total=G.arrows.length;
  P.cur=i;put('ntw_progress',P);refreshMenu();
  $('lvl').textContent='Level '+(i+1)+' of '+N;
  $('mv').textContent='0';updateRem();
  $('note').textContent=i===0?'Tap an arrow whose path is clear.':'';
  $('modal').classList.remove('on');
}
function updateRem(){$('rem').textContent=G.left+' / '+G.total}

function blocked(a){
  var d=DIR[a.d],n=LEVELS[G.lv].n,r=a.r+d[0],c=a.c+d[1];
  while(r>=0&&c>=0&&r<n&&c<n){
    for(var k=0;k<G.arrows.length;k++){var x=G.arrows[k];if(!x.gone&&x.r===r&&x.c===c)return true}
    r+=d[0];c+=d[1];
  }
  return false;
}

function tap(a){
  if(a.gone)return;
  G.moves++;$('mv').textContent=G.moves;
  var pad=a.el.querySelector('.pad'),ring=document.createElement('span');
  ring.className='ring';pad.appendChild(ring);
  ring.addEventListener('animationend',function(){ring.remove()});
  a.el.classList.remove('hint');
  if(blocked(a)){
    G.wrong++;sfx('wrong');buzz(30);
    a.el.classList.remove('bump');void a.el.offsetWidth;a.el.classList.add('bump');
    $('note').textContent='Blocked. Clear the arrows in its way first.';
    return;
  }
  a.gone=true;G.left--;updateRem();sfx('correct');buzz(10);
  var d=DIR[a.d],n=LEVELS[G.lv].n,dist;
  if(a.d==='R')dist=n-a.c;else if(a.d==='L')dist=a.c+1;else if(a.d==='D')dist=n-a.r;else dist=a.r+1;
  a.el.style.transform='translate('+(d[1]*(dist+.3)*100)+'%,'+(d[0]*(dist+.3)*100)+'%)';
  a.el.classList.add('out');
  setTimeout(function(){a.el.remove()},650);
  $('note').textContent='';
  if(G.left===0){var id=G.id;setTimeout(function(){if(id===G.id)win()},700)}
}

function hint(){
  for(var k=0;k<G.arrows.length;k++){
    var a=G.arrows[k];
    if(!a.gone&&!blocked(a)){
      G.hints++;a.el.classList.remove('hint');void a.el.offsetWidth;a.el.classList.add('hint');
      $('note').textContent='That glowing arrow can leave now.';return;
    }
  }
}

function win(){
  var pen=G.wrong+G.hints*2,k=G.total,st=pen<=Math.ceil(k*.1)?3:(pen<=Math.ceil(k*.35)?2:1);
  P.stars[G.lv]=Math.max(P.stars[G.lv]||0,st);
  var nx=Math.min(G.lv+1,N-1);
  P.unlocked=Math.max(P.unlocked,nx);P.cur=nx;put('ntw_progress',P);refreshMenu();
  var last=G.lv===N-1;
  var s=$('stars').children;
  for(var i=0;i<3;i++){s[i].className=i<st?'f':''}
  $('mt').textContent=last?'All levels cleared!':'Level '+(G.lv+1)+' cleared!';
  $('ms').textContent=G.moves+' moves \u2022 '+G.wrong+' blocked taps \u2022 '+G.hints+' hints';
  $('next').textContent=last?'Choose a level':'Next Level';
  $('modal').classList.add('on');
  sfx('win');buzz([20,40,20]);
}

/* ---------- events ---------- */
$('play').addEventListener('click',function(){show('game');loadLevel(P.cur);sfx('start')});
$('lvls').addEventListener('click',function(){buildChips();show('levels')});
$('lback').addEventListener('click',function(){show('menu')});
$('home').addEventListener('click',function(){show('menu')});
$('mhome').addEventListener('click',function(){$('modal').classList.remove('on');buildChips();show('levels')});
$('reset').addEventListener('click',function(){loadLevel(G.lv)});
$('replay').addEventListener('click',function(){loadLevel(G.lv)});
$('hintBtn').addEventListener('click',hint);
$('next').addEventListener('click',function(){
  if(G.lv===N-1){$('modal').classList.remove('on');buildChips();show('levels');return}
  var g=$('grid');g.style.opacity=0;$('modal').classList.remove('on');
  setTimeout(function(){loadLevel(G.lv+1)},250);
});
$('sfx').addEventListener('click',function(){S.sfx=!S.sfx;put('ntw_settings',S);refreshMenu();if(S.sfx)sfx('correct');else stopSfx()});
$('mus').addEventListener('click',function(){S.music=!S.music;put('ntw_settings',S);refreshMenu();music()});
refreshMenu();

/* ---------- PWA service worker (works on https hosting such as Vercel) ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
</body>
</html>
